<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>16人小人美术验收板</title><style>
*{box-sizing:border-box}body{margin:0;background:#080910;color:#eee;font-family:system-ui,"Microsoft YaHei",sans-serif;padding:24px}h1{margin:0 0 5px;font-size:25px}p{margin:0 0 15px;color:#9aa5aa;font-size:13px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.bar button{background:#121923;border:1px solid #536871;color:#d7ebe8;border-radius:5px;padding:6px 13px;cursor:pointer}.bar button.on{background:#31534f}.grid{display:grid;grid-template-columns:repeat(4,minmax(180px,1fr));gap:12px}.card{height:178px;border:1px solid #33434c;border-radius:10px;background-size:cover;background-position:center 45%;position:relative;overflow:hidden}.card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.62));pointer-events:none}.card canvas{position:absolute;z-index:1;left:50%;top:4px;transform:translateX(-50%);width:150px;height:138px;filter:drop-shadow(0 4px 4px #000)}.name{position:absolute;z-index:2;left:10px;bottom:8px;font-size:13px}.void{background-image:url('../assets/scenes/void.webp')}.lava{background-image:url('../assets/scenes/lava.webp')}.spring{background-image:url('../assets/scenes/spring.webp')}.native{margin-top:16px;padding:14px;border:1px solid #303c43;border-radius:9px;color:#94a0a5;font-size:12px}.native canvas{vertical-align:middle;margin-right:8px;background:#101721;border:1px dashed #53616a}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
</style></head><body><h1>16人 · 程序化小人 2.0 验收板</h1><p>上方为放大观察；底部为真实战斗与选角尺寸。场景按钮用于检查不同背景下的轮廓。</p>
<div class="bar" id="states"><button data-v="idle" class="on">待机</button><button data-v="attack">攻击</button><button data-v="hurt">受击</button><button data-v="stun">眩晕</button><button data-v="dead">死亡</button></div>
<div class="bar" id="scenes"><button data-v="void" class="on">墨色虚空</button><button data-v="lava">赤焰熔岩</button><button data-v="spring">碧蓝灵泉</button></div>
<div class="grid" id="grid"></div><div class="native"><canvas id="nativeBattle" width="100" height="92"></canvas><canvas id="nativeSelect" width="80" height="90"></canvas>当前选中角色的真实尺寸（点击任意角色卡切换）</div>
<script type="module">
import{CHARACTERS}from'../src/data/data.js';import{drawStickman}from'../src/view/stickman.js';
let state='idle',selected=CHARACTERS[0],start=performance.now();const grid=document.getElementById('grid'),battle=document.getElementById('nativeBattle'),select=document.getElementById('nativeSelect');
for(const c of CHARACTERS){const card=document.createElement('div');card.className='card void';card.innerHTML=`<canvas width="100" height="92"></canvas><span class="name" style="color:${c.color}">${c.name} · ${c.role}</span>`;card.onclick=()=>selected=c;grid.appendChild(card);card._char=c;card._cv=card.querySelector('canvas')}
function bind(id,set){document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{document.querySelectorAll(`#${id} button`).forEach(x=>x.classList.remove('on'));b.classList.add('on');set(b.dataset.v);start=performance.now()})}bind('states',v=>state=v);bind('scenes',v=>document.querySelectorAll('.card').forEach(c=>c.className=`card ${v}`));
function frame(now){document.querySelectorAll('.card').forEach(c=>drawStickman(c._cv,c._char,state,(now-start)/16));drawStickman(battle,selected,state,(now-start)/16);drawStickman(select,selected,state,(now-start)/16);requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></body></html>
