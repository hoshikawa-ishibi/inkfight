<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>墨路远征 · 浏览器验收台</title>
<style>body{margin:0;background:#101b22;color:#cce6d9;font:13px system-ui}header{padding:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button{padding:7px 12px;background:#a9c7ae;border:0;cursor:pointer}iframe{width:100%;height:calc(100vh - 58px);border:0;display:block}#status{color:#dec992}</style>
<header><b>真实界面验收</b><button id="auto">开启玩家代理</button><button id="manual">交还手动</button><button id="mobile">390px 手机视口</button><span id="status">手动操作 · 测试保持静音</span></header>
<iframe id="game" title="真实游戏界面" src="../inkfight.html"></iframe>
<script type="module">
const frame=document.querySelector('#game');
frame.onload=()=>{const script=frame.contentDocument.createElement('script');script.type='module';script.src=new URL('./expedition-browser-driver.js',location.href).href;frame.contentDocument.body.append(script);};
document.querySelector('#auto').onclick=()=>frame.contentWindow.postMessage({inkCheck:'auto'},location.origin);
document.querySelector('#manual').onclick=()=>frame.contentWindow.postMessage({inkCheck:'manual'},location.origin);
document.querySelector('#mobile').onclick=()=>{frame.style.width=frame.style.width==='390px'?'100%':'390px';frame.style.height='844px';};
window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data.inkCheckStatus)document.querySelector('#status').textContent=e.data.inkCheckStatus;});
</script></html>
